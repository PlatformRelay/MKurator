# Pre-union Basic manifest, stored-v1alpha1 twin (AUTH-15 AC1).
#
# This is byte-for-byte the shape operators shipped BEFORE the ADR-0027 authentication
# union: apiVersion v1alpha1, a legacy `credentialsSecretRef`, and NO `spec.authentication`.
# It is kept as a pinned regression twin of config/samples/messaging_v1beta1_queuemanagerconnection.yaml
# to prove ADR-0027's promise — "every existing Basic connection keeps working unchanged" —
# holds on a post-union cluster: it converts (union dropped on the v1alpha1 spoke, AUTH-12)
# and reconciles to Ready=True, and the mqweb Basic + CSRF headers are byte-identical to the
# pre-union baseline (unit oracle TestClient_BasicHeadersIdenticalPreAndPostUnion, e2e
# "reconciles a pre-union v1alpha1 Basic QueueManagerConnection unchanged post-union").
#
# Not in config/samples/kustomization.yaml on purpose: it shares metadata.name with the
# v1beta1 sample, so applying both in one kustomize run would collide on the same object.
apiVersion: messaging.mkurator.dev/v1alpha1
kind: QueueManagerConnection
metadata:
  name: qm1
  namespace: mkurator-system
  annotations:
    messaging.mkurator.dev/allow-insecure-tls: "true"
spec:
  queueManager: QM1
  endpoint: https://ibm-mq.ibm-mq.svc:9443
  tls:
    insecureSkipVerify: true
  credentialsSecretRef:
    name: mq-credentials
