# Explicit Basic authentication (ADR-0027 spec.authentication union).
# Equivalent to omitting `authentication` and setting `credentialsSecretRef` — the
# implicit-Basic, backward-compatible shape. Use the explicit form when you want the
# auth mode to be visible in the manifest / GitOps diff, or to prepare for a future
# migration to LTPA/ClientCert (later slices).
apiVersion: messaging.mkurator.dev/v1beta1
kind: QueueManagerConnection
metadata:
  name: qm1-explicit-basic
  namespace: mkurator-system
  annotations:
    messaging.mkurator.dev/allow-insecure-tls: "true"
spec:
  queueManager: QM1
  endpoint: https://ibm-mq.ibm-mq.svc:9443
  tls:
    insecureSkipVerify: true
  authentication:
    mode: Basic
    basic:
      secretRef:
        name: mq-credentials
