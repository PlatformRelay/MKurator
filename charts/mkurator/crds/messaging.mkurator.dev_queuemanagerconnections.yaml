                    properties:
                      name:
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  insecureSkipVerify:
                    description: InsecureSkipVerify disables server certificate verification
                      (dev only).
                    type: boolean
                type: object
            required:
            - endpoint
            - queueManager
            type: object
            x-kubernetes-validations:
            - message: either credentialsSecretRef or authentication must be set
              rule: has(self.credentialsSecretRef) || has(self.authentication)
            - message: credentialsSecretRef and authentication.basic.secretRef must
                name the same Secret
              rule: '!has(self.credentialsSecretRef) || !has(self.authentication)
                || !has(self.authentication.basic) || self.authentication.basic.secretRef.name
