              In CamelCase.

              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds'
            type: string
          metadata:
            type: object
          spec:
            description: "QueueManagerConnectionSpec defines how to reach an IBM MQ\
              \ queue manager.\n\nCEL admission (ADR-0025, ADR-0027) enforces:\n \
              \ - a credential source is always present: either the legacy credentialsSecretRef\n\
              \    (implicit Basic) or an explicit authentication union.\n  - structural\
              \ exclusivity of the authentication union: the member struct matching\n\
              \    mode must be set and no other member may be set. Stateful checks\
              \ (Secret\n    existence and keys) stay in the validating webhook.\n\
              \  - Basic-compat non-conflict (ADR-0027 \xA7CRD shape, \"not both authentication\
              \ and a\n    Basic-implying credentialsSecretRef in conflicting ways\"\
              ): when BOTH the legacy\n    credentialsSecretRef and an explicit Basic\
              \ union are supplied they must name the\n    SAME Secret. This is the\
              \ narrowest rule satisfying AUTH-15 AC3 \u2014 a redundant\n    identical\
              \ pair is admitted, and each field ALONE stays valid forever, so no\n\
              \    pre-union manifest is ever false-rejected. The OR-guards short-circuit\n\
              \    left-to-right so absent fields never trigger a nil traversal in\
              \ CEL."
            properties:
              authentication:
                description: 'Authentication selects how MKurator authenticates to
                  the mqweb admin REST API

                  (ADR-0027). Exactly one mode; the member struct matching mode is
                  required and no

                  other member may be set (CEL-enforced structural exclusivity). When
                  omitted, the

                  connection defaults to Basic reading credentialsSecretRef, preserving
                  existing

                  manifests. Basic and LTPA are accepted; ClientCert lands in a later
                  slice.'
                properties:
                  basic:
                    description: 'Basic authenticates with HTTP Basic against SecretRef
                      (keys: username/password,

                      mqAdminUser/mqAdminPassword also accepted). Required when mode
                      is Basic.'
                    properties:
                      secretRef:
                        description: 'SecretRef references a Secret with mqweb credentials.

                          Required key: password (mqAdminPassword is also accepted).
                          Username is optional:

                          username, user, or mqAdminUser (defaults to admin when absent;
                          admission warns).'
                        properties:
                          name:
                            minLength: 1
                            type: string
                        required:
                        - name
                        type: object
                    required:
                    - secretRef
                    type: object
                  clientCert:
                    description: 'ClientCert authenticates with a client certificate/mTLS
                      (later slice).

                      Required when mode is ClientCert.'
                    properties:
                      secretRef:
                        description: SecretRef references a Secret holding the client
                          keypair (keys tls.crt/tls.key).
                        properties:
                          name:
                            minLength: 1
                            type: string
                        required:
                        - name
                        type: object
                    required:
                    - secretRef
                    type: object
                  ltpa:
                    description: LTPA authenticates with an LTPA login token (AUTH-13).
                      Required when mode is LTPA.
                    properties:
                      secretRef:
                        description: 'SecretRef references a Secret holding the login
                          username/password used to obtain

                          an LTPA cookie. LTPA is login-derived (ADR-0027). Keys:
                          password (mqAdminPassword

                          also accepted); username optional (username/user/mqAdminUser,
                          defaults to admin).'
                        properties:
                          name:
                            minLength: 1
                            type: string
                        required:
                        - name
                        type: object
                    required:
                    - secretRef
                    type: object
                  mode:
                    description: Mode selects the authentication mechanism. Basic
                      and LTPA are accepted.
                    enum:
                    - Basic
                    - LTPA
                    type: string
                required:
                - mode
                type: object
                x-kubernetes-validations:
                - message: authentication.basic is required when mode is Basic
                  rule: self.mode != 'Basic' || has(self.basic)
                - message: authentication.ltpa is required when mode is LTPA
                  rule: self.mode != 'LTPA' || has(self.ltpa)
                - message: authentication.clientCert is required when mode is ClientCert
                  rule: self.mode != 'ClientCert' || has(self.clientCert)
                - message: authentication.basic may only be set when mode is Basic
                  rule: '!has(self.basic) || self.mode == ''Basic'''
                - message: authentication.ltpa may only be set when mode is LTPA
                  rule: '!has(self.ltpa) || self.mode == ''LTPA'''
                - message: authentication.clientCert may only be set when mode is
                    ClientCert
                  rule: '!has(self.clientCert) || self.mode == ''ClientCert'''
              credentialsSecretRef:
                description: "CredentialsSecretRef references a Secret with mqweb\
                  \ credentials.\nRequired key: password (mqAdminPassword is also\
                  \ accepted). Username is optional:\nusername, user, or mqAdminUser\
                  \ (defaults to admin when absent; admission warns).\n\nOptional\
                  \ as of ADR-0027: when omitted, an explicit authentication union\
                  \ must be\nsupplied instead (CEL-enforced). When present and authentication\
                  \ is absent, the\nconnection uses HTTP Basic against this Secret\
                  \ \u2014 the pre-ADR-0027 behaviour, so\nevery existing manifest\
                  \ keeps working verbatim."
                properties:
                  name:
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              endpoint:
                description: Endpoint is the mqweb base URL, e.g. https://ibm-mq.ibm-mq.svc:9443
                pattern: ^https://
                type: string
              queueManager:
                description: QueueManager is the IBM MQ queue manager name (case-sensitive).
                minLength: 1
                type: string
              restPrefix:
                description: RESTPrefix is the mqweb REST API path prefix. Defaults
                  to /ibmmq/rest/v3.
                pattern: ^/
                type: string
              tls:
                description: TLS configures HTTPS trust for mqweb.
                properties:
