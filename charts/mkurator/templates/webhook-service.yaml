{{- if .Values.webhooks.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mkurator.webhookServiceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mkurator.labels" . | nindent 4 }}
spec:
  # Publish the not-ready address so the webhook Service reaches the manager pod
  # before it passes its readiness probe, avoiding a startup deadlock where cache
  # sync waits on the webhook and readiness waits on cache sync. (8e-8a: the CRD
  # conversion webhook was removed; only the v1beta1 validating webhook is served.)
  publishNotReadyAddresses: true
  ports:
    - port: 443
      protocol: TCP
      targetPort: webhook-server
  selector:
    {{- include "mkurator.selectorLabels" . | nindent 4 }}
{{- end }}
